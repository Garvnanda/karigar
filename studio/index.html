<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Karigar Studio</title>
<meta name="description" content="Design a gold piece by tapping a few choices: three castable designs, solved to your gold, priced line by line.">
<meta name="theme-color" content="#1D0A10">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Rubik:wght@400;500&family=Tiro+Devanagari+Hindi&display=swap">
<link rel="stylesheet" href="studio.css">
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
</head>
<body>
<header class="bar">
  <div class="container">
    <a class="wordmark" href="#/" aria-label="Karigar, home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M12 3 4 9l8 12 8-12-8-6Z"/><path d="M4 9h16M9 9l3 12 3-12M9 9l3-6 3 6"/></svg>
      Karigar
    </a>
    <nav class="nav" aria-label="Main">
      <a class="navlink" href="#/design" data-nav="design">Create</a>
      <a class="navlink" href="#/orders" data-nav="orders">My orders<span class="count" id="order-count"></span></a>
    </nav>
  </div>
  <svg class="band" viewBox="0 0 1200 10" preserveAspectRatio="none" fill="currentColor" aria-hidden="true"><path d="M0 1h1200v.6H0zM0 8.4h1200V9H0z"/></svg>
</header>

<main id="app">
  <section class="room intro">
    <div class="tray"><img class="still" src="assets/ring_halo_solitaire.png" alt="Halo Solitaire Ring in 22K yellow gold, rendered from its castable model"></div>
    <div class="slip">
      <h1>A new piece, solved to your gold.</h1>
      <p class="lead">Tap a few choices. Get three castable designs, priced line by line.</p>
      <p class="actions"><a class="btn btn--gold" href="#/design">Create your design</a></p>
    </div>
  </section>
</main>

<footer class="foot">
  <div class="container">
    <span>Weights are measured on each design’s 3D model. Prices use today’s gold rate.</span>
    <a href="/console/">Shop owner</a>
  </div>
</footer>
<script src="studio.js"></script>
</body>
</html>
